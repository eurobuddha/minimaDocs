<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Image studio</title><link rel="stylesheet" href="/workbench/typography.css"><link rel="stylesheet" href="/workbench/photocraft-mobile.css"></head>
<body><header id="photo-bar"><span id="dimensions">IMAGE STUDIO</span><div><button id="undo" aria-label="Undo" disabled>↶</button><button id="redo" aria-label="Redo" disabled>↷</button><button id="fit" aria-label="Fit photo">Fit</button><button id="compare" aria-label="Hold to compare with original">Before</button></div></header>
<main id="stage"><iframe id="editor" title="PhotoCraft image canvas" tabindex="-1"></iframe><div id="touch" aria-label="Photo canvas. Drag to pan; pinch to zoom."><svg id="guides" aria-hidden="true"><path id="stroke"/><g id="crop-guide"></g></svg></div><img id="before" alt="Original image" hidden><div id="loading" role="status"><span class="spinner"></span><strong>Opening your image</strong><small>PhotoCraft · on your device</small></div></main>
<div id="message" role="status" hidden></div><section id="sheet" aria-label="Editing tools"></section><nav id="tabs" aria-label="Image editor"><button data-tab="looks">◉ <span>Looks</span></button><button data-tab="tools" class="selected">⌘ <span>Tools</span></button><button data-tab="edits">☷ <span>Edits</span></button></nav><script src="/workbench/photocraft-mobile.js"></script></body></html>
