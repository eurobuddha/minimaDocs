plugins { id 'com.android.application' }
android {
    namespace 'org.mininotes.android'
    compileSdk 37
    defaultConfig {
        applicationId 'com.eurobuddha.minimadocs'
        minSdk 28
        targetSdk 35
        versionCode 302
        versionName '0.3.2'
        testInstrumentationRunner 'org.mininotes.android.DocumentInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    // The Maxima transport's IPC is signature-gated: it answers an app signed with its own key and nobody
    // else. So a build that is to ask it anything has to be signed with that key. Where to find the key and
    // what it is called are read from an untracked file, never from here - a key checked into a repository
    // is a key that has been given away.
    //
    // Put this in android/keystore.properties, which .gitignore already keeps out:
    //     storeFile=/path/to/family-release.jks
    //     storePassword=...
    //     keyAlias=...
    //     keyPassword=...
    // Then: ./gradlew assembleRelease  -> a signed APK the transport will talk to.
    // Without that file the release build is unsigned exactly as it was, and nothing here fails.
    signingConfigs {
        family {
            def where=rootProject.file('keystore.properties')
            if(where.exists()) {
                def said=new Properties()
                where.withInputStream { said.load(it) }
                storeFile file(said.getProperty('storeFile'))
                storePassword said.getProperty('storePassword')
                keyAlias said.getProperty('keyAlias')
                keyPassword said.getProperty('keyPassword')
            } else if(project.hasProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')) {
                storeFile file(MINIMA_FAMILY_RELEASE_STORE_FILE)
                storePassword MINIMA_FAMILY_RELEASE_STORE_PASSWORD
                keyAlias MINIMA_FAMILY_RELEASE_KEY_ALIAS
                keyPassword MINIMA_FAMILY_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if(rootProject.file('keystore.properties').exists()||project.hasProperty('MINIMA_FAMILY_RELEASE_STORE_FILE'))signingConfig signingConfigs.family
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    // Reading and drawing QR codes. Plain Java, Apache-2.0, no AndroidX: a pairing line is 350 characters,
    // which is a thing to point a camera at rather than a thing to type.
    implementation 'com.google.zxing:core:3.5.3'
    // The Maxima transport itself, vendored under maxima-core/. This app does not ask another app for an
    // address any more: it is the node, the way Parlons is, so the address is simply something it knows.
    implementation project(':maxima-core')
    // SQLCipher: the notebook encrypted with its key when the owner sets a password (Profile → Security).
    implementation 'net.zetetic:sqlcipher-android:4.19.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.1'
}

// Fail before packaging an APK with empty editor buttons.
tasks.register('verifyEditorAssets') {
    doLast {
        ['editor.html','image/index.html','sdkjs/common/wasm/x2t/x2t.wasm.br','minimadocs-engines.json','fonts/manrope-regular','fonts/manrope-bold'].each { asset ->
            if (!file("src/main/assets/editors/$asset").isFile()) {
                throw new GradleException('Offline editor assets are missing. Run node scripts/prepare-editors.cjs from the repository root first.')
            }
        }
        if (!file('src/main/assets/editors/sdkjs/common/AllFonts.js').text.contains('"Manrope"')) throw new GradleException('Rebuild the office engine with scripts/customize-office.mjs to register Manrope.')
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) task.dependsOn('verifyEditorAssets')
}
