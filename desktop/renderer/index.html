<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>minimaDocs</title><link rel="stylesheet" href="app.css"></head><body>
<aside><div class="brand"><svg viewBox="0 0 36 42" aria-hidden="true"><path d="M5 3h24v33H5z" fill="#fcfbf7" stroke="currentColor" stroke-width="2"/><path d="M11 3v33m6-23h8m-8 7h8m-8 7h5" fill="none" stroke="#e63312" stroke-width="2"/></svg><span>minima<span class="brand-docs">Docs</span></span></div>
<button id="new-document" class="primary new-button">New document <span aria-hidden="true">＋</span></button>
<nav aria-label="Workspace"><button data-page="files" aria-current="page">Files <span id="file-count">0</span></button><button data-page="shared">Shared</button><button data-page="people">People</button></nav>
<div class="sidebar-bottom"><span class="eyebrow">YOUR CONNECTION</span><p id="connection" class="connection">Opening workspace…</p><button id="settings" class="text-button">Settings</button><div class="edition">minimaDocs for Mac <span id="version"></span></div></div></aside>
<div class="workspace"><header class="topbar"><span id="breadcrumb">Workspace / Files</span><label class="search"><span>Find a file</span><input id="search" type="search" placeholder="Search your workspace" aria-label="Search files"><kbd>⌘ K</kbd></label><button id="import" class="quiet">Import a file</button></header>
<main id="main"><section class="intro"><div><span class="eyebrow">MADE FOR YOUR IDEAS</span><h1 id="heading">Your workspace.</h1><p id="subtitle">Write, calculate, create. Everything starts here.</p></div><button id="open-invitation" class="quiet">Open invitation</button></section>
<section id="create" class="create-grid" aria-label="Create a file">
<button data-new="docx" class="create-card document"><div class="card-mark"><svg viewBox="0 0 70 80" aria-hidden="true"><path d="M14 6h44v65H14z"/><path d="M23 6v65m8-48h19m-19 10h19m-19 10h19m-19 10h12"/></svg></div><div><span class="card-category">01 / WRITE</span><h2>Document</h2><p>A blank page. All the possibilities.</p></div><span class="card-arrow" aria-hidden="true">↗</span></button>
<button data-new="xlsx" class="create-card sheet"><div class="card-mark"><svg viewBox="0 0 70 80" aria-hidden="true"><path d="M9 13h51v52H9zM9 26h51M9 39h51M9 52h51M25 13v52M43 13v52"/></svg></div><div><span class="card-category">02 / CALCULATE</span><h2>Spreadsheet</h2><p>Bring your numbers into focus.</p></div><span class="card-arrow" aria-hidden="true">↗</span></button>
<button data-new="image" class="create-card image"><div class="card-mark"><svg viewBox="0 0 70 80" aria-hidden="true"><path d="M12 17h40v44H12zM20 9h40v44"/><circle cx="27" cy="33" r="7"/><path d="m13 58 17-14 9 7 12-18"/></svg></div><div><span class="card-category">03 / CREATE</span><h2>Image</h2><p>Layers, colour and a fresh canvas.</p></div><span class="card-arrow" aria-hidden="true">↗</span></button>
</section><section id="library"><div class="library-bar"><div id="filters" role="group" aria-label="File type"><button data-kind="all" aria-pressed="true">All files</button><button data-kind="docx">Documents</button><button data-kind="xlsx">Sheets</button><button data-kind="image">Images</button></div><span class="sort">Recently updated</span></div><div id="files" aria-live="polite"></div></section><section id="people" hidden></section></main>
<footer><span>Saved on your Mac. Shared through Maxima.</span><span>YOUR WORK, IN YOUR HANDS.</span></footer></div>
<div id="notice" role="status" hidden></div><dialog id="dialog"><div class="dialog-heading"><span class="eyebrow" id="dialog-label">MINIMADOCS</span><button id="close-dialog" aria-label="Close dialog">Close</button></div><div id="dialog-body"></div></dialog><script src="app.js"></script><script src="parlons.js"></script></body></html>
