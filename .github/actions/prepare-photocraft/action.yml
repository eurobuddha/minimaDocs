name: Prepare offline PhotoCraft
description: Build the pinned PhotoCraft engine with the reviewed minimaDocs adapters.
runs:
  using: composite
  steps:
    - name: Read the engine pin
      id: pin
      shell: bash
      run: node -e 'const p=require("./desktop/photocraft/pin.json");for(const k of ["revision","rust","trunk"])console.log(k+"="+p[k]);' >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: storytold/photocraft
        ref: ${{ steps.pin.outputs.revision }}
        path: photocraft-engine
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.pin.outputs.rust }}
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: photocraft-engine
        key: minimadocs-photocraft
    - name: Install pinned Trunk
      shell: bash
      env:
        TRUNK_VERSION: ${{ steps.pin.outputs.trunk }}
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" trunk
        trunk --version
    - name: Build and verify the offline engine
      shell: bash
      env:
        PHOTOCRAFT_SOURCE: ${{ github.workspace }}/photocraft-engine
      run: node desktop/scripts/prepare-photocraft.cjs
