name: Android device checks
on:
  workflow_dispatch:
  push:
    branches: [minimadocs]
    paths: ['.github/workflows/android-device.yml', 'scripts/android-device-check.py', 'android/app/src/androidTest/**', 'android/app/src/debug/**']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-editors
      - uses: actions/checkout@v4
        with:
          repository: eurobuddha/maxima
          ref: 668f3544601f0d226fc067b307519d0b2f522d7b
          path: android/build/parlons
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build minimaDocs and test runner
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build the existing Parlons app
        working-directory: android/build/parlons
        run: ./gradlew :app:assembleDebug "-Dorg.gradle.java.home=$JAVA_HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          script: python3 scripts/android-device-check.py
