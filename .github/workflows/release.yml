name: Release

# A version tag builds a signed Android draft release. Branch pushes do not publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A secret cannot be read in a step's `if`, so whether one is set is decided
    # once here and asked about by name below.
    env:
      SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-editors

      - uses: ./.github/actions/prepare-photocraft

      # Three places name the version and they have to agree before anything is built: the tag, the
      # build's own versionName, and dist/latest.txt, which is the one line every installed pad reads
      # to learn whether it is behind. A tag ahead of that file publishes a build nobody is told about;
      # a file ahead of the tag tells everybody about a build that does not exist.
      - name: The tag, the build and latest.txt agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BUILD=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          SAID=$(tr -d ' \r\n' < dist/latest.txt)
          echo "tag=$TAG build=$BUILD latest.txt=$SAID"
          [ "$TAG" = "$BUILD" ] || { echo "::error::tag v$TAG but versionName is $BUILD"; exit 1; }
          [ "$TAG" = "$SAID" ] || { echo "::error::tag v$TAG but dist/latest.txt says $SAID"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Require the release signing key
        if: env.SIGNING_KEY == ''
        run: |
          echo "::error::Configure the existing family release signing secrets before building an installer."
          exit 1

      - name: Prepare the signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/key.jks"
          chmod 600 "$RUNNER_TEMP/key.jks"

      - name: Test, lint, build signed release
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_MINIMA_FAMILY_RELEASE_STORE_FILE: ${{ runner.temp }}/key.jks
          ORG_GRADLE_PROJECT_MINIMA_FAMILY_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MINIMA_FAMILY_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MINIMA_FAMILY_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Name it after the tag
        id: name
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        id: sign
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.jks"

      - name: Gather
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="${{ steps.sign.outputs.apk }}"
          test -n "$SRC"
          NAME="minimaDocs-${{ steps.name.outputs.version }}.apk"
          cp "$SRC" "out/$NAME"
          ( cd out && sha256sum "$NAME" > "$NAME.sha256" )
          ls -l out

      # A locally signed, verified release may already have been published while
      # this build ran. Never turn that public release back into a draft.
      - name: Check existing publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"; then
            node -e 'const r=require(process.env.RUNNER_TEMP+"/release.json");console.log("published="+(!r.draft));' >> "$GITHUB_OUTPUT"
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release-error.txt" || { cat "$RUNNER_TEMP/release-error.txt"; exit 1; }
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.publication.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: out/*
          generate_release_notes: true
          draft: true
          body: |
            Install: download the APK, check it with the `.sha256` beside it,
            and open it on the phone.

            The pad works on its own, and nothing else has to be installed to
            share between phones: it is its own Maxima node. See the README.

            Docs, Sheets and layered Images save on this phone and share saved
            updates through Maxima. Concurrent versions are kept for review.
            Parlons contacts connect through its existing approval screen.
            See the README for compatibility tests and current limits.
