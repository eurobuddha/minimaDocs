name: Check

on:
  push:
    branches: [main, minimadocs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tests, lint and a release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-editors

      - name: Android update pointer matches the build
        shell: bash
        run: |
          set -euo pipefail
          BUILD=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          SAID=$(tr -d ' \r\n' < dist/latest.txt)
          [ "$BUILD" = "$SAID" ] || { echo "::error::versionName=$BUILD but dist/latest.txt=$SAID"; exit 1; }

      - name: Editor bridge and transport tests
        run: node --test tests/editor-bridge.test.cjs tests/core.test.cjs

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, build
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      # A failed run should say which test, not just that something failed.
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore

      - name: Version the APK
        id: apk
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/minimaDocs-$VERSION-unsigned.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: minimaDocs-${{ steps.apk.outputs.version }}-unsigned-apk
          path: out/*.apk
