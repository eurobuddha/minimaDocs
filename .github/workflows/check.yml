name: Check

on:
  push:
    branches: [main, minimadocs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tests, lint and a release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-editors

      - name: Editor bridge and transport tests
        run: node --test tests/editor-bridge.test.cjs tests/core.test.cjs

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, build
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      # A failed run should say which test, not just that something failed.
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore

      - name: Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: minimaDocs-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
