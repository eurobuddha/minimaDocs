name: Verify offline office engine

on:
  workflow_dispatch:
  push:
    branches: [minimadocs]
    paths: ['.github/workflows/office-engine.yml']

permissions:
  contents: read

jobs:
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ranuts/document
          ref: 9c743826d0152239dc7ad51677535d59679c7ff1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install compatibility test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: DOCX and XLSX feature round trips
        run: pnpm exec playwright test test/e2e/docx-features.spec.ts test/e2e/xlsx-features.spec.ts --workers=1
      - name: Compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-compatibility-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: office-engine-9c743826
          path: |
            dist/
            LICENSE
            NOTICE
          retention-days: 14
