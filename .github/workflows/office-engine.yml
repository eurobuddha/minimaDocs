name: Verify offline office engine

on:
  workflow_dispatch:
  push:
    branches: [minimadocs]
    paths: ['.github/workflows/office-engine.yml']

permissions:
  contents: read

jobs:
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ranuts/document
          ref: 9c743826d0152239dc7ad51677535d59679c7ff1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: office-engine-9c743826
          path: |
            dist/
            LICENSE
            NOTICE
          retention-days: 14
