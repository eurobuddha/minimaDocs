<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>minimaDocs — Design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e4de;color:#171714;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;background:#fcfbf7;z-index:2;border-bottom:1px solid #cbc8c0;padding:18px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font:26px Georgia,serif;margin:0}nav{display:flex;gap:8px;flex:1;flex-wrap:wrap}button{min-height:44px;padding:10px 16px;border:1px solid #aaa69c;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#20201c;color:white;border-color:#20201c}button:focus-visible{outline:3px solid #e63312;outline-offset:3px}.status{font-size:12px;color:#625e57}.note{padding:14px 24px;background:#f4f2ec;line-height:1.5;border-bottom:1px solid #d1cec5}.viewport{overflow:auto;padding:24px;text-align:center;height:calc(100vh - 155px)}img{display:block;width:100%;max-width:1700px;height:auto;margin:auto;box-shadow:0 4px 24px #00000010}.viewport.zoom img{width:2048px;max-width:none}.viewport.zoom{text-align:left}@media(max-width:700px){header{gap:12px;padding:12px}.viewport{padding:8px;height:75vh}button{padding:8px 10px}}
</style>
<header><h1>minimaDocs</h1><nav aria-label="Mockup boards"><button data-board="word-unfolded.png" aria-pressed="true">01 · Word — Fold open</button><button data-board="word-phone.png" aria-pressed="false">02 · Word — Fold closed</button><button data-board="parlons.png" aria-pressed="false">03 · Parlons &amp; sharing</button></nav><button id="zoom" aria-pressed="false">Zoom in</button><span class="status">Design review · v1</span></header>
<div class="note" id="note">Proposed Word interface: page layout, formatting ribbon, document outline and paragraph controls. Static visual mockup; app implementation is paused.</div>
<main class="viewport" id="viewport"><img id="board" src="word-unfolded.png" alt="Proposed minimaDocs Word interface on the unfolded Fold"></main>
<script>
const descriptions={'word-unfolded.png':'Proposed Word interface: page layout, formatting ribbon, document outline and paragraph controls. Static visual mockup; app implementation is paused.','word-phone.png':'Proposed outer-screen experience: browse documents, write with the keyboard open, and use a formatting sheet. Static visual mockups; controls inside the images are not interactive.','parlons.png':'Proposed Parlons flow: approval, existing contacts, document permissions, and queued updates. Sample contacts only. Static visual mockups; no invitations are sent.'};
document.querySelectorAll('[data-board]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-board]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.getElementById('board').src=button.dataset.board;document.getElementById('board').alt=button.textContent;document.getElementById('note').textContent=descriptions[button.dataset.board];document.getElementById('viewport').scrollTo(0,0)}));
document.getElementById('zoom').addEventListener('click',event=>{const zoom=document.getElementById('viewport').classList.toggle('zoom');event.target.setAttribute('aria-pressed',String(zoom));event.target.textContent=zoom?'Fit to window':'Zoom in'});
</script></html>
